media:
  input: src/_includes/img
  output: /img

content:
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    view:
      fields: [title, date, tags]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The main headline for the post. Keep it concise and descriptive.

      - name: description
        label: Description
        type: string
        required: true
        description: A short summary for SEO and social sharing. Max 160 characters.
        options:
          maxlength: 160

      - name: date
        label: Date
        type: date
        required: true
        description: Publication date and time. Use 15:00:00 for consistency.
        options:
          format: yyyy-MM-dd HH:mm:ss
          time: true

      - name: tags
        label: Tags
        type: select
        default: event
        description: Categorize the post. Common tags are event, grant, winners, thanks.
        options:
          values: [event, grant, winners, thanks, announcement]
          creatable: true

      - name: navlogo
        label: Nav Logo
        type: select
        default: installation
        description: Icon shown in navigation. Match to post type (e.g., cash for grants, trophy for winners).
        options:
          values: [installation, cash, trophy, thanks, announcement]

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/post.njk

      - name: image
        label: Image
        type: image
        description: Main image for the post. Displayed as hero at top of post and used for social sharing.
        options:
          path: blog

      - name: ogImage
        label: Social Image Override
        type: image
        description: Optional. Use only if you need a different image for social sharing (e.g., static image instead of GIF).
        options:
          path: blog

      - name: body
        label: Body
        type: code
        description: Post content in HTML/Markdown.
        options:
          language: html

  - name: films
    label: Films (2025)
    type: collection
    path: src/extrapages/films
    filename: "{primary}.njk"
    format: yaml-frontmatter
    view:
      fields: [title, authors]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: authors
        label: Artists
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
            description: Artist/director name

          - name: instagram
            label: Instagram Handle
            type: string
            description: Instagram username (without @)

          - name: bio
            label: Bio
            type: rich-text
            description: Short biography of the artist (HTML supported)

      - name: image
        label: Hero Image
        type: image
        required: true
        description: Main image displayed at top of film page
        options:
          path: films

      - name: body
        label: Artist Statement
        type: rich-text
        description: Artist statement (HTML supported). Typically wrapped in quotes and italics.

      - name: navlogo
        label: Nav Logo
        type: select
        default: emojianim
        description: "🎬 emojianim | 🖼️ installation | 👋 wave"
        options:
          values:
            - label: "🎬 Film"
              value: emojianim
            - label: "🖼️ Installation"
              value: installation
            - label: "👋 Wave"
              value: wave

      - name: backgroundcolor
        label: Background Color
        type: select
        default: "F5F5F5"
        description: Choose a preset color or enter a custom hex code (without #)
        options:
          values:
            - label: Light Gray
              value: "F5F5F5"
            - label: Light Blue
              value: "6fcae7"
            - label: Yellow
              value: "FEE283"
            - label: Aqua
              value: "7fffd4"
            - label: Dark Green
              value: "2E6021"
            - label: Neon Green
              value: "39ff14"
          creatable: true

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/film.njk

  - name: sponsors
    label: Sponsors (2025)
    type: file
    path: src/_data/sponsors.json
    format: json
    fields:
      - name: list
        label: Sponsors
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
            description: Sponsor or partner name

          - name: url
            label: Website URL
            type: string
            required: true
            description: Link to sponsor website

          - name: logo
            label: Logo
            type: image
            required: true
            description: Sponsor logo image
            options:
              path: sponsors

          - name: tier
            label: Tier
            type: select
            default: sponsor
            description: Sponsorship level
            options:
              values: [organizer, partner, sponsor]

  - name: installations
    label: Installations (2025)
    type: file
    path: src/_data/installations.json
    format: json
    fields:
      - name: list
        label: Installations
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
            description: Installation title (URL will be auto-generated from this)

          - name: authors
            label: Authors
            type: object
            list:
              collapsible:
                summary: "{fields.name}"
            fields:
              - name: name
                label: Name
                type: string
                required: true
                description: Artist name

              - name: instagram
                label: Instagram Handle
                type: string
                description: Instagram username (without @)

          - name: navlogo
            label: Nav Logo
            type: select
            default: installation
            description: Icon shown in navigation
            options:
              values: [installation, door, handwave, trophy, cash]
              creatable: true

          - name: backgroundcolor
            label: Background Color
            type: select
            required: true
            description: Choose a preset color or enter a custom hex code (without #)
            options:
              values:
                - label: Light Blue (6fcae7)
                  value: "6fcae7"
                - label: Yellow (FEE283)
                  value: "FEE283"
                - label: Aqua (7fffd4)
                  value: "7fffd4"
                - label: Dark Green (2E6021)
                  value: "2E6021"
                - label: Light Gray (f0f0f0)
                  value: "f0f0f0"
                - label: Neon Green (39ff14)
                  value: "39ff14"
              creatable: true

          - name: heroImage
            label: Hero Image
            type: image
            required: true
            description: Main image displayed at top of installation page
            options:
              path: sketches

          - name: description
            label: Body Content
            type: code
            required: true
            description: Installation description/body content in HTML format
            options:
              language: html

          - name: showAllFilms
            label: Show All Films Link
            type: boolean
            default: true
            description: If checked, shows "All selected films screened" link instead of specific films list

          - name: filmsScreened
            label: Films Screened
            type: reference
            description: Select films from the Films collection (only used if "Show All Films Link" is unchecked)
            options:
              collection: films
              multiple: true
              value: "{title}"
              label: "{title}"
              search: title

          - name: galleryImages
            label: Gallery Images
            type: image
            description: Upload or select images for the gallery. For new installations, create a folder matching the slugified title (e.g., "the-hands-that-hold-us") and upload images there.
            options:
              multiple: true
