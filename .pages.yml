media:
  input: src/_includes/img
  output: /img

content:
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    view:
      fields: [title, date, tags]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The main headline for the post. Keep it concise and descriptive.

      - name: description
        label: Description
        type: string
        required: true
        description: A short summary for SEO and social sharing. Max 160 characters.
        options:
          maxlength: 160

      - name: date
        label: Date
        type: date
        required: true
        description: Publication date and time. Use 15:00:00 for consistency.
        options:
          format: yyyy-MM-dd HH:mm:ss
          time: true

      - name: tags
        label: Tags
        type: select
        default: event
        description: Categorize the post. Common tags are event, grant, winners, thanks.
        options:
          values: [event, grant, winners, thanks, announcement]
          creatable: true

      - name: navlogo
        label: Nav Logo
        type: select
        default: installation
        description: Icon shown in navigation. Match to post type (e.g., cash for grants, trophy for winners).
        options:
          values: [installation, cash, trophy, thanks, announcement]

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/post.njk

      - name: image
        label: Image
        type: image
        description: Main image for the post. Displayed as hero at top of post and used for social sharing.
        options:
          path: blog

      - name: ogImage
        label: Social Image Override
        type: image
        description: Optional. Use only if you need a different image for social sharing (e.g., static image instead of GIF).
        options:
          path: blog

      - name: body
        label: Body
        type: code
        description: Post content in HTML/Markdown.
        options:
          language: html

  - name: films
    label: Films
    type: collection
    path: src/extrapages/films
    filename: "{primary}.njk"
    format: yaml-frontmatter
    view:
      fields: [title, authors, year]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Film Title
        type: string
        required: true
        description: The exact title of your film as you want it displayed. Special characters and formatting will be preserved.

      - name: authors
        label: Filmmakers
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        description: Add all filmmakers (directors, artists) associated with this film. Each can have their own bio and Instagram.
        fields:
          - name: name
            label: Full Name
            type: string
            required: true
            description: Your full name as you want it credited on the site.

          - name: instagram
            label: Instagram Handle
            type: string
            description: "Your Instagram username without the @ symbol. Leave blank if you don't want to link Instagram."

          - name: bio
            label: Bio
            type: rich-text
            description: A brief biography (2-4 sentences) about you as a filmmaker. Describe your background, artistic focus, and any notable achievements. Links are supported.

      - name: image
        label: Film Still
        type: image
        required: true
        description: "A compelling still frame or promotional image from your film. Use JPG format, landscape orientation (16:9 or similar), minimum 1920px wide, under 500KB. This appears as the hero image on your film page and in the film gallery."
        options:
          path: films

      - name: artistStatement
        label: Artist Statement
        type: rich-text
        description: Your statement about this film (1-3 paragraphs). Describe your creative vision, inspiration, themes explored, and what you want viewers to take away. This will be displayed in quotes and italics. For multiple paragraphs, use blank lines between them.

      - name: navlogo
        label: Nav Logo
        type: select
        default: 🎥 Film
        description: The animated icon shown in the navigation bar when viewing this film page.
        options:
          values: [🎥 Film, 📺 Installation, 🌊 Wave]

      - name: backgroundcolor
        label: Page Background Color
        type: select
        default: Light Gray
        description: The background color for your film page. Light Gray works well for most content. Choose a color that complements your film still.
        options:
          values: [Light Gray, Light Blue, Yellow, Aqua, Dark Green, Neon Green]
          creatable: true

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/film.njk

      - name: year
        label: Festival Year(s)
        type: select
        description: Which year(s) this film was selected. Select multiple if it appeared in both years.
        default: ["2025"]
        options:
          values: ["2023", "2025"]
          multiple: true

  - name: sponsors
    label: Sponsors
    type: collection
    path: src/extrapages/sponsors
    filename: "{primary}.njk"
    format: yaml-frontmatter
    view:
      fields: [name, tier, year]
      primary: name
      sort: [tier, name]
      default:
        sort: tier
        order: asc
    fields:
      - name: name
        label: Organization Name
        type: string
        required: true
        description: The full name of the sponsor or partner organization.

      - name: url
        label: Website URL
        type: string
        required: true
        description: The sponsor's website URL including https:// (e.g., https://example.com)

      - name: logo
        label: Logo
        type: image
        required: true
        description: "Sponsor logo image. Requirements: PNG format with transparent background strongly preferred. Dimensions: 400-500px square works best (e.g., 400x400 or 500x500). Horizontal logos also work if similar height (e.g., 500x300). Keep file size under 200KB. Logos display at 50% container width on desktop and scale responsively."
        options:
          path: sponsors

      - name: tier
        label: Sponsorship Tier
        type: select
        default: sponsor
        description: The level of sponsorship. Organizers appear first, then Partners, then Sponsors.
        options:
          values: [organizer, partner, sponsor]

      - name: year
        label: Festival Year(s)
        type: select
        description: Which year(s) this sponsor supported. Select multiple if they sponsored both years.
        default: ["2025"]
        options:
          values: ["2023", "2025"]
          multiple: true

  - name: installations
    label: Installations
    type: collection
    path: src/extrapages/installations
    filename: "{primary}.njk"
    format: yaml-frontmatter
    view:
      fields: [title, authors, year]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Installation Title
        type: string
        required: true
        description: The title of your installation artwork. The page URL will be auto-generated from this title.

      - name: authors
        label: Artists
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        description: Add all artists who created this installation. Each can have their own Instagram linked.
        fields:
          - name: name
            label: Full Name
            type: string
            required: true
            description: Your full name as you want it credited on the site.

          - name: instagram
            label: Instagram Handle
            type: string
            description: Your Instagram username without the @ symbol. Leave blank if you don't want to link Instagram.

      - name: heroImage
        label: Hero Image
        type: image
        required: true
        description: "The main promotional image for your installation. Use JPG format, landscape orientation, minimum 1920px wide, under 500KB. This appears at the top of your installation page and in the gallery."
        options:
          path: sketches

      - name: description
        label: Installation Description
        type: rich-text
        required: true
        description: "Describe your installation in 2-5 paragraphs. Include your artistic concept, materials used, how visitors interact with it, and its connection to the festival themes."

      - name: navlogo
        label: Nav Logo
        type: select
        default: 📺 Installation
        description: The animated icon shown in the navigation bar when viewing this installation page.
        options:
          values: [📺 Installation, 🚪 Door, 🖐️ Hand Wave, 🏆 Trophy, 💵 Cash, 🚚 Truck, ⛵ Boat, ☁️ Clouds, 🗼 Tower, 🔦 Flashlight, 📢 Loudspeaker]
          creatable: true

      - name: backgroundcolor
        label: Page Background Color
        type: select
        required: true
        description: The background color for this installation page. Choose a color that complements your hero image and artwork aesthetic.
        options:
          values: [Light Blue, Yellow, Aqua, Dark Green, Light Gray, Neon Green]
          creatable: true

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/installation.njk

      - name: showAllFilms
        label: Show All Films Link
        type: boolean
        default: true
        description: When checked, shows a link to "All selected films screened" instead of listing specific films. Uncheck if you want to list specific films that will be screened at this installation.

      - name: filmsScreened
        label: Films Screened
        type: reference
        description: Only used if "Show All Films Link" is unchecked. Select which films from the festival will be screened at this installation.
        options:
          collection: films
          multiple: true
          value: "{title}"
          label: "{title}"
          search: title

      - name: galleryImages
        label: Gallery Images
        type: image
        description: "Additional photos of your installation showing documentation, detail shots, and audience interaction. Use JPG format, any orientation, minimum 1200px on longest side."
        options:
          multiple: true
          path: installations

      - name: year
        label: Festival Year(s)
        type: select
        description: Which year(s) this installation appeared in. Select multiple if it appeared in both years.
        default: ["2025"]
        options:
          values: ["2023", "2025"]
          multiple: true


