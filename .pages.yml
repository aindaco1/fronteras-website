media:
  input: src/_includes/img
  output: /img

content:
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    view:
      fields: [title, date, tags]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The main headline for the post. Keep it concise and descriptive.

      - name: description
        label: Description
        type: string
        required: true
        description: A short summary for SEO and social sharing. Max 160 characters.
        options:
          maxlength: 160

      - name: date
        label: Date
        type: date
        required: true
        description: Publication date and time. Use 15:00:00 for consistency.
        options:
          format: yyyy-MM-dd HH:mm:ss
          time: true

      - name: tags
        label: Tags
        type: select
        default: event
        description: Categorize the post. Common tags are event, grant, winners, thanks.
        options:
          values: [event, grant, winners, thanks, announcement]
          creatable: true

      - name: navlogo
        label: Nav Logo
        type: select
        default: installation
        description: Icon shown in navigation. Match to post type (e.g., cash for grants, trophy for winners).
        options:
          values: [installation, cash, trophy, thanks, announcement]

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/post.njk

      - name: image
        label: Image
        type: image
        description: Main image for the post. Displayed as hero at top of post and used for social sharing.
        options:
          path: blog

      - name: ogImage
        label: Social Image Override
        type: image
        description: Optional. Use only if you need a different image for social sharing (e.g., static image instead of GIF).
        options:
          path: blog

      - name: body
        label: Body
        type: code
        description: Post content in HTML/Markdown.
        options:
          language: html

  - name: sponsors
    label: Sponsors
    type: file
    path: src/_data/sponsors.json
    format: json
    fields:
      - name: list
        label: Sponsors
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
            description: Sponsor or partner name

          - name: url
            label: Website URL
            type: string
            required: true
            description: Link to sponsor website

          - name: logo
            label: Logo
            type: image
            required: true
            description: Sponsor logo image
            options:
              path: sponsors

          - name: tier
            label: Tier
            type: select
            default: sponsor
            description: Sponsorship level
            options:
              values: [organizer, partner, sponsor]
