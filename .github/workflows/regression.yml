name: Visual regression and optional Jev

on:
  workflow_dispatch:
    inputs:
      live_jev:
        description: 'Send the fixed public rendered-text cases to Jev (estimated reservation $0.01344)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Trust checked-out repositories in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/shared/dust-wave-platform"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Match local screenshots of original media. The deployment job separately
      # exercises the optimized production assets via build:ci.
      - run: npm run build
      - run: npm run test:visual
      - name: Zero-network Jev preview
        if: ${{ !inputs.live_jev }}
        run: node scripts/evaluate-jev.mjs --out .cache/jev/ci-preview
      - name: Bounded advisory Jev evaluation
        if: ${{ inputs.live_jev }}
        run: node scripts/evaluate-jev.mjs --live --max-usd 0.02 --out .cache/jev/ci-live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload screenshots, diffs, traces, and Jev evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-evidence
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .cache/jev/
          retention-days: 14
