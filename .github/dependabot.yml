version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Upgrade Playwright with its container, pin assertion, and reviewed screenshots.
    ignore:
      - dependency-name: "@playwright/test"
    open-pull-requests-limit: 5
    groups:
      eleventy:
        patterns:
          - "@11ty/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
